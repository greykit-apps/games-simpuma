  const onResize = () => { fitView(V); centreOn(V, D.cx + 6, D.cy + 2); };
  window.addEventListener("resize", onResize);
  D.off = () => window.removeEventListener("resize", onResize);
  TITLE.last = performance.now();
  const frame = now => {
    TITLE.raf = requestAnimationFrame(frame);
    if (!cv.isConnected) return;
    const dt = Math.min(200, now - TITLE.last); TITLE.last = now;
    D.t += dt;
    /* a bot move every 220 ms until the plan is done, then a tick every 160 ms */
    TITLE.acc += dt;
    while (TITLE.acc > 160) {
      TITLE.acc -= 160;
      if (D.bot.length) { for (let n = 0; n < 2 && D.bot.length; n++) botStep(D.S, D.bot.shift()); if (D.step++ % 4 === 0) simTick(D.S); }
      else { simTick(D.S); if (D.S.month % 7 === 0 && D.S.tick === 0 && Math.random() < 0.6) botExtend(D.S, D.bot); }
      D.S.news = [];
      if (D.S.month > 160) fresh();
    }
    if (!reduced()) { const a = D.t / 24000; V.cam.x = (D.cx + 6 + Math.cos(a) * 9) * TILE - V.w / 2; V.cam.y = (D.cy + 2 + Math.sin(a * 0.8) * 5) * TILE - V.h / 2; clampCam(V); }
    if (now - (D.afT || 0) > 140) { V.af++; D.afT = now; }
    drawView(V, { noCursor: true });
  };
  TITLE.raf = requestAnimationFrame(frame);
}
function stopDemo() { cancelAnimationFrame(TITLE.raf); if (TITLE.demo && TITLE.demo.off) TITLE.demo.off(); TITLE.demo = null; }
/* the plan: a plant, a grid of roads, wires, and zones along the roads */
function botPlan(S) {
  const cx = W / 2 | 0, cy = H / 2 | 0, plan = [];
  plan.push(["coal", cx - 16, cy - 3]);
  for (let x = cx - 12; x <= cx + 20; x++) plan.push(["road", x, cy + 1]);
  for (let y = cy - 11; y <= cy + 13; y++) plan.push(["road", cx + 4, y]);
  for (let x = cx - 12; x <= cx + 20; x++) plan.push(["road", x, cy - 7]);
  for (let x = cx - 12; x <= cx + 20; x++) plan.push(["road", x, cy + 9]);
  for (let y = cy - 11; y <= cy + 13; y++) plan.push(["road", cx - 8, y]);
  for (let y = cy - 11; y <= cy + 13; y++) plan.push(["road", cx + 16, y]);
  /* power rides the roads: a line from the plant to the grid, then along every road */
  plan.push(["wire", cx - 12, cy]);
  for (let x = cx - 12; x <= cx + 20; x++) { plan.push(["wire", x, cy + 1]); plan.push(["wire", x, cy - 7]); plan.push(["wire", x, cy + 9]); }
  for (let y = cy - 11; y <= cy + 13; y++) { plan.push(["wire", cx - 8, y]); plan.push(["wire", cx + 16, y]); }
  const kinds = ["R", "R", "C", "R", "I", "R", "C", "I", "R", "R", "C", "R"];
  let k = 0;
  const rows = [cy - 10, cy - 6, cy - 2, cy + 2, cy + 6, cy + 10];
  const cols = [cx - 11, cx - 5, cx - 2, cx + 1, cx + 7, cx + 10, cx + 13, cx + 19];
  for (const y of rows) for (const x of cols) { if (Math.random() < 0.85) plan.push([kinds[k++ % kinds.length], x, y]); }
  plan.push(["police", cx + 7, cy - 2]); plan.push(["fireSt", cx - 5, cy + 6]); plan.push(["park", cx - 1, cy - 2]); plan.push(["park", cx, cy - 2]);
  return plan;
}
function botStep(S, [tool, x, y]) {
  const plan = canPlace(S, tool, x, y);
  if (!plan.ok) return;
  if (plan.bridge && tool === "wire") return;
  place(S, tool, x, y, plan);
  if (KINDS[tool]) scanPower(S);
}
function botExtend(S, plan) {
  /* another block of zones on an existing road, or a stadium once the town is big */
  const roads = [];
  for (let i = 0; i < S.T.length; i++) if (S.T[i] === T_ROAD) roads.push(i);
  if (!roads.length) return;
  const i = roads[Math.random() * roads.length | 0], x = i % W, y = (i - x) / W;
  const k = ["R", "R", "C", "I"][Math.random() * 4 | 0];
  const spots = [[x - 3, y - 1], [x + 1, y - 1], [x - 1, y - 3], [x - 1, y + 1]];
  for (const [sx, sy] of spots) if (canPlace(S, k, sx, sy).ok) { plan.push([k, sx, sy]); break; }
  if (S.pop > 2000 && !S.blds.some(b => b && b.k === "stadium") && Math.random() < 0.3) plan.push(["stadium", x + 1, y + 1]);
  if (S.unpowered > S.powered && Math.random() < 0.5) plan.push(["coal", x + 1, y - 5]);
}
/* ---- the share card: ?shot=og renders it for tools/render-icons.sh ---- */
function renderCard() {
  document.body.innerHTML = "";
  document.body.style.cssText = "margin:0;width:1200px;height:630px;overflow:hidden;background:#05070f";
  const cv = document.createElement("canvas"); cv.width = 1200; cv.height = 630; cv.style.cssText = "display:block;width:1200px;height:630px";
  document.body.appendChild(cv);
  const g = cv.getContext("2d"); g.imageSmoothingEnabled = false;
  /* a town, grown for forty years at speed */
  const S = newCity({ seed: 20261024, name: "card", disasters: false });
  const plan = botPlan(S);
  while (plan.length) botStep(S, plan.shift());
  for (let i = 0; i < 160; i++) { simTick(S); S.news = []; if (i % 24 === 0) botExtend(S, plan); while (plan.length) botStep(S, plan.shift()); }
  const V = makeView(cv); V.S = S; V.zoom = 2; V.scale = 2; V.w = 600; V.h = 315;
  V.cam.x = (W / 2 + 5) * TILE - 300 + 150; V.cam.y = (H / 2 + 1) * TILE - 157;
  V.af = 5;
  drawView(V, { noCursor: true, noBolt: true });
  g.setTransform(1, 0, 0, 1, 0, 0);
  const sh = g.createLinearGradient(0, 0, 1200, 0);
  sh.addColorStop(0, "rgba(5,7,15,1)"); sh.addColorStop(0.5, "rgba(5,7,15,.96)"); sh.addColorStop(0.68, "rgba(5,7,15,.35)"); sh.addColorStop(0.8, "rgba(5,7,15,0)");
  g.fillStyle = sh; g.fillRect(0, 0, 1200, 630);
  const foot = g.createLinearGradient(0, 480, 0, 630); foot.addColorStop(0, "rgba(5,7,15,0)"); foot.addColorStop(1, "rgba(5,7,15,.9)");
  g.fillStyle = foot; g.fillRect(0, 480, 1200, 150);
  g.fillStyle = PAL.cyan; g.fillRect(0, 0, 1200, 8);
  g.textBaseline = "top";
  const cs = getComputedStyle(document.documentElement), logo = n => { const im = new Image(); im.src = cs.getPropertyValue("--k-logo-" + n).trim().replace(/^url\((.*)\)$/, "$1"); return im; };
  const sim = logo("sim"), puma = logo("puma");
  const after = () => { if (!sim.complete || !puma.complete) return; g.imageSmoothingEnabled = false; g.drawImage(sim, 100, 60, sim.width * 3, sim.height * 3); g.drawImage(puma, 100 + sim.width * 3 + 24, 60, puma.width * 3, puma.height * 3); };
  sim.onload = after; puma.onload = after;
  g.font = "32px Pride"; g.fillStyle = "#b8c4e2";
  const lines = ["Build a city of pumas. A remake of", "SimCity (1989) in 16-bit painted pixel", "art: zone, power, tax, and keep the", "pride happy through fires, floods", "and a very large kitten."];
  lines.forEach((l, i) => g.fillText(l, 104, 250 + i * 44));
  g.fillStyle = PAL.gold; g.fillText("One file · Offline · Tactical", 104, 492);
  g.fillStyle = "#6b7694"; g.fillText("greykit.com/games/simpuma", 104, 556);
  /* the icon, 6 times its size, on its tile */
  const ic = new Image();
  ic.onload = () => { g.drawImage(ic, 1020, 40, 128, 128); document.title = "og ready"; };
  ic.src = "icon.svg";
}

/* ---- main: the boot (§3), the intro (§14), then the title ---- */
(async function main() {
  /* a debug and test hook: __SP.state, __SP.disaster("kitten"), __SP.months(n) */
  window.__SP = { get state() { return UI.S; }, disaster: k => UI.S && startDisaster(UI.S, k, true), months(n) { for (let i = 0; i < n * 4 && UI.S; i++) simTick(UI.S); updateHUD(); }, ui: UI, art: ART, newCity, simTick };
  const q = new URLSearchParams(location.search);
  try { await document.fonts.load("8px Pride"); } catch (e) { /* the system's monospace, then */ }
  if (q.get("shot") === "og") { buildArt(); renderCard(); return; }
  /* ?shot=city: a grown town on the game screen, for the README's screenshot */
  if (q.get("shot") === "city") {
    buildArt(); UI.V = makeView($("#view")); buildTools(); wireInput();
    const S = newCity({ seed: 20261024, name: "Catnip Falls", disasters: false }), plan = botPlan(S);
    while (plan.length) botStep(S, plan.shift());
    for (let i = 0; i < 200; i++) { simTick(S); S.news = []; if (i % 24 === 0) botExtend(S, plan); while (plan.length) botStep(S, plan.shift()); }
    S.funds = 14250; UI.tool = "R";
    startGame(S); setSpeed(0); centreOn(UI.V, W / 2 + 4, H / 2 + 1); UI.V.hover = [W / 2 + 10, H / 2 + 6]; msg("The pumas want more homes: zone residential.", "");
    return;
  }
  /* ?shot=title: the title as it stands once the intro is over, the demo town grown, for the README */
  if (q.get("shot") === "title") {
    injectTitleCSS(); injectIntroCSS(); buildArt(); UI.V = makeView($("#view")); buildTools(); wireInput();
    showTitle(true);
    UI.sw = gkIntegrate(TITLE.root, { toggles: soundToggles(), tick: null });
    /* no entrance: the menu is simply there, the default focused */
    const b = TITLE.root.querySelector(".gk-primary"); if (b) b.focus({ preventScroll: true });
    return;
  }
  const saved = loadCity();
  const intro = startIntro({
    audio: A.ctx,
    lines: [bootReloadLine(), gkFact("city", saved ? `${saved.name}, ${dateStr(saved.month)}` : "none"), gkFlavour(FLAVOUR, RARE, q.has("rare") ? 1 : 12)]
  });
  injectTitleCSS();
  buildArt();
  UI.V = makeView($("#view"));
  buildTools();
  wireInput();
  showTitle(true);
  /* the hold, the title fading up over the demo town, the name a line at a time, the menu */
  intro.finish({
    prefix: GAME, title: TITLE.root, name: "lines", hold: q.get("hold") || "auto",
    timing: { name: 500, step: 700, menu: 2800, done: 3900 },
    toggles: soundToggles(), tick: () => gkTick(A.ac, A.fx),
    onContinue: () => { const ac = A.ctx(); if (ac && ac.state !== "running") ac.resume(); },
    onTitle: () => A.startTune()
  }).then(r => { UI.sw = r.toggles; });
  /* M is the game's master switch on the title too (§8) */
  document.addEventListener("keydown", ev => {
    if (UI.S || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ev.target.closest && ev.target.closest("input,textarea,select")) return;
    const k = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
    if (k === "m") { ev.preventDefault(); A.setMuted(!A.muted); return; }
    /* a window of the game's over the title takes the keys; the title's menu does not */
    if (UI.wins.length) { ev.stopPropagation(); if (ev.key === "Escape") { ev.preventDefault(); closeWin(); } }
  }, true);
  /* save when the tab goes away */
  const stash = () => { if (UI.S) { UI.S.camX = UI.V.cam.x; UI.S.camY = UI.V.cam.y; UI.S.speed = UI.speed; saveCity(UI.S); } };
  document.addEventListener("visibilitychange", () => { if (document.hidden) stash(); });
  window.addEventListener("pagehide", stash);
})();
</script>
